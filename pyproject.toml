[project]
name = "interfaze-1-lite"
version = "0.1.0"
description = "Interfaze 1 Lite: the whole model on one GPU, behind an OpenAI-compatible endpoint"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "rapidfuzz>=3.14",
]

[project.optional-dependencies]
# GPU extras are installed in the Docker image, not for local contract work.
serve = ["vllm==0.27.1"]
# The llama.cpp deployment (llamacpp/run.sh): the reasoning core and the document reader
# are GGUF files served by llama-server, so this is the orchestrator plus the perception
# and diarization sidecars, without vLLM. `uv sync --extra llamacpp`.
llamacpp = [
    "uvicorn[standard]",
    "fastapi[standard]",
    "pillow",
    "numpy",
    "pymupdf",
    # perception: speech, segmentation, line geometry and layout, forecasting
    "torch",
    "torchaudio",
    "transformers==5.15.0",
    "accelerate",
    "huggingface_hub",
    "soundfile",
    "einops",
    "paddleocr==3.3.2",
    "paddlepaddle==3.2.2",
    "opencv-python-headless>=4.13.0",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
    "pandas",
    "timesfm[torch] @ git+https://github.com/google-research/timesfm.git@bf88c5dc88f6275b7071ebcd9051406c11435c0c",
    # the document reader's own prompt and HTML-to-markdown helper
    "chandra-ocr>=0.2.0",
    # diarization; gated on Hugging Face, so it needs HF_TOKEN (run.sh skips it without one)
    "pyannote.audio",
]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The llamacpp extra pins SAM 2 and TimesFM to git commits, as the Dockerfile does.
allow-direct-references = true

[tool.uv]
# vLLM pins its own torch; the llama.cpp deployment never installs it.
conflicts = [[{ extra = "serve" }, { extra = "llamacpp" }]]
environments = ["sys_platform == 'linux'"]

[tool.uv.extra-build-dependencies]
# SAM 2's setup.py imports torch.
sam-2 = ["torch"]

[tool.uv.extra-build-variables]
# Its optional CUDA extension only post-processes masks, and building it needs nvcc.
sam-2 = { SAM2_BUILD_CUDA = "0" }

[tool.hatch.build.targets.wheel]
packages = ["src/interfaze_lite"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "models"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PIE", "PERF"]
ignore = [
    # Tool executors and test doubles must match a fixed signature, so an unused
    # `args`/`ctx` is the interface working, not dead weight.
    "ARG001", "ARG002",
    # NamedTemporaryFile(delete=False) is deliberate: the file has to outlive the
    # block that makes it, and the caller unlinks it in a finally.
    "SIM115",
    # Some secret stores expose the token as lowercase `hf_token`; renaming it to satisfy
    # a naming rule would break every gated-repo download.
    "SIM112",
    # Long explanatory comments are load-bearing here -- several record a measured
    # failure that would otherwise be reintroduced.
    "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
